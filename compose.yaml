
name: leadscopeb2b

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina a senha no .env}
    ports:
      - "127.0.0.1:14331:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Defina a senha no .env}
    configs:
      - source: esquema_sql
        target: /bootstrap/esquema.sql
      - source: objetos_sql
        target: /bootstrap/objetos.sql
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sql() {
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -f 65001 "$$@"
        }
        sql -d master -Q "IF DB_ID(N'LeadScopeB2B') IS NULL CREATE DATABASE [LeadScopeB2B];"
        tabelas=$$(sql -d LeadScopeB2B -h -1 -W -Q 'SET NOCOUNT ON; SELECT COUNT(*) FROM sys.tables WHERE is_ms_shipped=0;')
        if [ "$$tabelas" = 0 ]; then
          sql -d LeadScopeB2B -i /bootstrap/esquema.sql
        fi
        sql -d LeadScopeB2B -i /bootstrap/objetos.sql
        echo 'Banco LeadScopeB2B preparado.'

  leadscope:
    build:
      context: .
      dockerfile: dockerfile
    image: leadscopeb2b:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LeadScopeB2B;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      DataProtection__DiretorioChaves: /app/keys
      RecuperacaoAcesso__Habilitado: ${RECUPERACAO_HABILITADO:-false}
      RecuperacaoAcesso__Provedor: ${RECUPERACAO_PROVEDOR:-Smtp}
      RecuperacaoAcesso__UrlPublica: ${RECUPERACAO_URL_PUBLICA:-http://localhost:18080}
      EmailResend__ApiKey: ${RESEND_API_KEY:-}
      EmailResend__Remetente: ${RESEND_REMETENTE:-}
      EmailResend__TemplateId: ${RESEND_TEMPLATE_ID:-}
      EmailResend__VariavelLink: ${RESEND_VARIAVEL_LINK:-RESET_URL}
      EmailSmtp__Host: ${SMTP_HOST:-}
      EmailSmtp__Porta: ${SMTP_PORTA:-587}
      EmailSmtp__Remetente: ${SMTP_REMETENTE:-}
      EmailSmtp__Usuario: ${SMTP_USUARIO:-}
      EmailSmtp__Senha: ${SMTP_SENHA:-}
      EmailSmtp__UsarTls: ${SMTP_USAR_TLS:-true}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - dataprotection_keys:/app/keys
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

configs:
  esquema_sql:
    file: ./Data/LeadScopeB2B.sql
  objetos_sql:
    file: ./Data/ObjetosLeadScopeB2B.sql

volumes:
  sqlserver_data:
  dataprotection_keys:
  integracoes_data:
