
name: leadscopeb2b

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina a senha no .env}
    ports:
      - "127.0.0.1:14331:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  leadscope:
    build:
      context: .
      dockerfile: dockerfile
    image: leadscopeb2b:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LeadScopeB2B;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      DataProtection__DiretorioChaves: /app/keys
      MotorIntegracoes__Diretorio: /app/integracoes
      MotorIntegracoes__AutomacaoHabilitada: ${COLETA_HABILITADA:-false}
      MotorIntegracoes__PermitirEscritaAutomatica: ${INTEGRACOES_ESCRITA_AUTOMATICA:-false}
      MotorIntegracoes__UrlPublicaOAuth: ${INTEGRACOES_URL_PUBLICA_OAUTH:-}
      MotorIntegracoes__RedesPrivadasJson: ${INTEGRACOES_REDES_PRIVADAS_JSON:-}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - dataprotection_keys:/app/keys
      - integracoes_data:/app/integracoes
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data:
  dataprotection_keys:
  integracoes_data:
