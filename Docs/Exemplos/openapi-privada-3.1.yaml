openapi: 3.1.0
info:
  title: ERP privado de demonstração
  version: '1.0'
servers:
  - url: http://127.0.0.1:8015/v1
security:
  - erp: []
paths:
  /companies/{registration}:
    get:
      operationId: consultarEmpresa
      summary: Consultar empresa no ERP
      parameters:
        - name: registration
          in: path
          required: true
          schema:
            type: string
            minLength: 14
            maxLength: 14
      responses:
        '200':
          description: Dados cadastrais da empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '401':
          description: Chave inválida
        '404':
          description: Empresa não encontrada
        '429':
          description: Limite excedido; respeitar Retry-After
components:
  securitySchemes:
    erp:
      type: apiKey
      in: header
      name: X-Integration-Key
  schemas:
    Empresa:
      type: object
      required: [registration, organization]
      properties:
        registration:
          type: string
        organization:
          type: object
          properties:
            legalName:
              type: string
        location:
          type: object
          properties:
            city:
              type: string
            state:
              type: string
